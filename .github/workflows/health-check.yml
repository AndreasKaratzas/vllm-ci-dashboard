name: Site Health Check

on:
  schedule:
    # Run after the :13 canonical collection/deploy window. Probes stay outside
    # the Pages lease; only the optional hourly-incident mutation is serialized.
    - cron: '57 * * * *'
  repository_dispatch:
    types: [site_health_tick]
  workflow_dispatch:

concurrency:
  group: site-health-monitor
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Three identity probes plus one complete canary/stream proof can consume
    # 1,507 seconds at their exact retry/deadline bounds. Preserve more than five
    # minutes for normalization, artifact upload, and issue reconciliation.
    timeout-minutes: 35
    outputs:
      hourly_recovery_evidence: ${{ steps.health-result.outputs.hourly_recovery_evidence }}
    steps:
      - name: Check out monitor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up exact Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.13'

      - name: Observe durable core collection freshness
        id: core-freshness
        continue-on-error: true
        run: |
          set -euo pipefail
          python scripts/vllm/request_bearing_attempt_budget.py \
            --config config/data_collection_attempt_budget.json observe \
            --github-output "$GITHUB_OUTPUT"

      - name: Run synthetic site health check
        id: synthetic-health
        continue-on-error: true
        env:
          SITE_URL: https://andreaskaratzas.github.io/vllm-ci-dashboard/
          REPORT_PATH: ${{ runner.temp }}/site-health-checker-report.json
          EFFECTIVE_REPORT_PATH: ${{ runner.temp }}/site-health-report.json
          DETAILS_PATH: ${{ runner.temp }}/site-health-detail.md
          BOOTSTRAP_EVIDENCE_PATH: ${{ runner.temp }}/dashboard-bootstrap-refs.json
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Seed bounded fail-closed evidence so a checker import/crash still
          # reaches artifact upload and marker-owned issue reconciliation.
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          report = {
              "schema_version": 1,
              "checked_at": datetime.now(timezone.utc).isoformat(),
              "healthy": False,
              "overall_status": "checker_not_completed",
              "reasons": ["synthetic checker did not produce a complete report"],
          }
          encoded = json.dumps(report, indent=2, sort_keys=True) + "\n"
          # Keep a fail-closed upload target independent of the raw checker
          # output. If normalization crashes, the artifact cannot expose a raw
          # healthy result that enforcement refused to trust.
          for variable in ("REPORT_PATH", "EFFECTIVE_REPORT_PATH"):
              Path(os.environ[variable]).write_text(encoded)
          Path(os.environ["DETAILS_PATH"]).write_text(
              "Synthetic checker did not produce bounded Markdown details.\n"
          )
          PY
          rm -f "$BOOTSTRAP_EVIDENCE_PATH"
          if ! python scripts/vllm/check_site_health.py \
            --write-bootstrap-ref-evidence "$BOOTSTRAP_EVIDENCE_PATH" \
            --repository "$GITHUB_REPOSITORY"; then
            echo "::warning::Dashboard-state ref evidence was ambiguous; legacy bootstrap health will fail closed."
            rm -f "$BOOTSTRAP_EVIDENCE_PATH"
          fi
          python scripts/vllm/check_site_health.py \
            --site-url "$SITE_URL" \
            --max-publication-age-hours 3 \
            --bootstrap-ref-evidence "$BOOTSTRAP_EVIDENCE_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$REPORT_PATH" \
            --github-output "$GITHUB_OUTPUT" \
            --markdown-output "$DETAILS_PATH"

      - name: Normalize bounded health evidence
        id: health-result
        if: always()
        env:
          CHECKER_OUTCOME: ${{ steps.synthetic-health.outcome }}
          CHECKER_HEALTHY: ${{ steps.synthetic-health.outputs.healthy }}
          SITE_HTTP: ${{ steps.synthetic-health.outputs.site_http }}
          SITE_BYTES: ${{ steps.synthetic-health.outputs.site_bytes }}
          PUBLICATION_HTTP: ${{ steps.synthetic-health.outputs.publication_http }}
          PUBLICATION_MODE: ${{ steps.synthetic-health.outputs.publication_mode }}
          PUBLICATION_STATUS: ${{ steps.synthetic-health.outputs.publication_status }}
          GENERATED_AT: ${{ steps.synthetic-health.outputs.generated_at }}
          AGE_HOURS: ${{ steps.synthetic-health.outputs.age_hours }}
          REASON_COUNT: ${{ steps.synthetic-health.outputs.reason_count }}
          OVERALL_STATUS: ${{ steps.synthetic-health.outputs.overall_status }}
          CONFIRMATION_CONFIRMED: ${{ steps.synthetic-health.outputs.confirmation_confirmed }}
          PROBE_ATTEMPTS: ${{ steps.synthetic-health.outputs.probe_attempts }}
          HEALTHY_PROBE_COUNT: ${{ steps.synthetic-health.outputs.healthy_probe_count }}
          REQUIRED_HEALTHY_PROBES: ${{ steps.synthetic-health.outputs.required_healthy_probes }}
          CORE_FRESHNESS_OUTCOME: ${{ steps.core-freshness.outcome }}
          CORE_COLLECTION_REQUIRED: ${{ steps.core-freshness.outputs.required }}
          CORE_REQUEST_MODE: ${{ steps.core-freshness.outputs.request_mode }}
          CORE_AVAILABLE_AT: ${{ steps.core-freshness.outputs.available_at }}
          CORE_LATEST_SUCCEEDED_AT: ${{ steps.core-freshness.outputs.latest_succeeded_at }}
          REPORT_PATH: ${{ runner.temp }}/site-health-checker-report.json
          EFFECTIVE_REPORT_PATH: ${{ runner.temp }}/site-health-report.json
          DETAILS_PATH: ${{ runner.temp }}/site-health-detail.md
          BODY_PATH: ${{ runner.temp }}/site-health-issue.md
          BOOTSTRAP_EVIDENCE_PATH: ${{ runner.temp }}/dashboard-bootstrap-refs.json
          SITE_URL: https://andreaskaratzas.github.io/vllm-ci-dashboard/
          OWNERSHIP_MARKER: '<!-- vllm-ci-dashboard:site-health:v1 -->'
        run: |
          set -euo pipefail
          python scripts/vllm/normalize_site_health_evidence.py

      - name: Upload bounded site health report
        id: upload-health-report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site-health-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site-health-report.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Reconcile marker-owned site health issue
        id: reconcile-health-issue
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          HEALTHY: ${{ steps.health-result.outputs.healthy }}
          CONFIRMED: ${{ steps.health-result.outputs.confirmed }}
          NORMALIZE_OUTCOME: ${{ steps.health-result.outcome }}
          BODY_PATH: ${{ runner.temp }}/site-health-issue.md
          OWNERSHIP_MARKER: '<!-- vllm-ci-dashboard:site-health:v1 -->'
        with:
          script: |
            const fs = require('fs');
            const ownershipMarker = process.env.OWNERSHIP_MARKER;
            const labelName = 'site-health';
            const statePlaceholder = '<!-- SITE_HEALTH_STATE -->';
            const recoveryPlaceholder = '<!-- SITE_HEALTH_RECOVERY_NOTE -->';
            const healthy = process.env.HEALTHY === 'true';
            const confirmed = process.env.CONFIRMED === 'true';
            const normalizationSucceeded = process.env.NORMALIZE_OUTCOME === 'success';
            if (!normalizationSucceeded || !confirmed) {
              core.warning('Synthetic evidence was not successfully normalized and quorum-confirmed; issue state is unchanged.');
              core.setOutput('reconciled', 'true');
              return;
            }
            const baseBody = fs.readFileSync(process.env.BODY_PATH, 'utf8');
            const hasExactMarker = body => String(body || '')
              .split(/\r?\n/)
              .some(line => line.trim() === ownershipMarker);
            if (!hasExactMarker(baseBody) ||
                !baseBody.includes(statePlaceholder) ||
                !baseBody.includes(recoveryPlaceholder)) {
              throw new Error('site-health body file is missing ownership/state placeholders');
            }

            // Identity comes from the exact body marker, while the automation-
            // repaired label is the durable bounded index. One bounded recent
            // page also recovers a newly removed label without making lookup
            // cost grow with the repository's lifetime issue count.
            const labeledResponse = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'all',
              labels: labelName,
              sort: 'updated',
              direction: 'desc',
              per_page: 100,
              page: 1,
            });
            if (labeledResponse.data.length >= 100) {
              throw new Error('site-health label lookup reached its bounded ambiguity limit');
            }
            let indexedOwned = labeledResponse.data
              .filter(issue => !issue.pull_request &&
                hasExactMarker(issue.body))
              .sort((left, right) => right.number - left.number);
            // The durable label normally resolves identity by itself. Consult
            // the bounded recent recovery index only when no exact owner was
            // found, which also keeps the common path at one list request.
            if (indexedOwned.length === 0) {
              const recentResponse = await github.rest.issues.listForRepo({
                ...context.repo,
                state: 'all',
                sort: 'updated',
                direction: 'desc',
                per_page: 100,
                page: 1,
              });
              const recovered = recentResponse.data
                .filter(issue => !issue.pull_request &&
                  hasExactMarker(issue.body))
                .sort((left, right) => right.number - left.number);
              if (recentResponse.data.length >= 100 && recovered.length === 0) {
                if (healthy) {
                  core.info('Confirmed healthy quorum with no indexed incident; no mutation is needed.');
                  core.setOutput('reconciled', 'true');
                  return;
                }
                throw new Error('site-health recent recovery lookup reached its bounded ambiguity limit');
              }
              indexedOwned = recovered;
            }
            const owned = indexedOwned;
            // The newest exact-marker issue is authoritative even when manually
            // closed. Otherwise an older open duplicate could bypass suppression.
            const existing = owned[0] || null;

            if (healthy && !existing) {
              core.info('Confirmed healthy quorum with no owned incident; nothing to close.');
              core.setOutput('reconciled', 'true');
              return;
            }

            // Complete identity discovery before the first mutation. This
            // keeps API errors and capped recovery pages byte-for-byte safe.
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: labelName });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                ...context.repo,
                name: labelName,
                color: 'b60205',
                description: 'Synthetic dashboard availability incidents',
              });
            }

            // A historical automation race must not leave two open incidents.
            for (const duplicate of owned) {
              if (duplicate.number !== existing?.number && duplicate.state === 'open') {
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number: duplicate.number,
                  state: 'closed',
                });
              }
            }

            const state = healthy ? 'closed' : 'open';
            const title = healthy
              ? '[Recovered] Dashboard synthetic monitor healthy'
              : '[Site Health] Dashboard synthetic monitor unhealthy';
            const note = healthy
              ? 'The in-run 2-of-3 healthy quorum confirmed recovery and rearmed this incident.'
              : 'The in-run 2-of-3 quorum confirmed the dashboard health failure.';
            const stateMarker = `<!-- site-health-state:confirmed=true;healthy=${healthy};rearmed=${healthy} -->`;
            const body = baseBody
              .replace(statePlaceholder, stateMarker)
              .replace(recoveryPlaceholder, note);
            if (Buffer.byteLength(body, 'utf8') > 32 * 1024) {
              throw new Error('bounded site-health issue body exceeded 32 KiB');
            }

            if (existing) {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: existing.number,
                title,
                body,
                state,
              });
              // addLabels is additive, so unrelated/manual labels are retained.
              // It also repairs presentation metadata if site-health was removed.
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: existing.number,
                labels: [labelName],
              });
              core.info(`Updated site-health issue #${existing.number} (${state}).`);
            } else {
              const created = await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: [labelName],
              });
              core.info(`Created site-health issue #${created.data.number}.`);
            }
            core.setOutput('reconciled', 'true');

      - name: Enforce synthetic health result
        if: always()
        env:
          HEALTHY: ${{ steps.health-result.outputs.healthy }}
          NORMALIZE_OUTCOME: ${{ steps.health-result.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-health-report.outcome }}
          RECONCILE_OUTCOME: ${{ steps.reconcile-health-issue.outcome }}
          RECONCILED: ${{ steps.reconcile-health-issue.outputs.reconciled }}
        run: |
          set -euo pipefail
          if [ "$NORMALIZE_OUTCOME" != "success" ] || \
             [ "$UPLOAD_OUTCOME" != "success" ] || \
             [ "$RECONCILE_OUTCOME" != "success" ] || \
             [ "$RECONCILED" != "true" ] || \
             [ "$HEALTHY" != "true" ]; then
            echo "::error::Synthetic site health is unhealthy or reconciliation evidence is incomplete."
            exit 1
          fi
          echo "Synthetic site health is healthy and issue state is reconciled."

  confirm-hourly-recovery:
    needs: check
    if: >-
      needs.check.result == 'success' &&
      needs.check.outputs.hourly_recovery_evidence != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      # The current Pages identity, pending incident credit, and issue mutation
      # are observed under the same non-cancelling lease as every publisher.
      group: gh-pages-deploy
      queue: max
      cancel-in-progress: false
    steps:
      - name: Check out exact monitor revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Confirm pending hourly recovery with serialized site evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RECOVERY_EVIDENCE: ${{ needs.check.outputs.hourly_recovery_evidence }}
        with:
          script: |
            const encoded = process.env.RECOVERY_EVIDENCE || '';
            if (encoded.length === 0 || encoded.length > 8192 ||
                !/^[A-Za-z0-9+/]+={0,2}$/.test(encoded)) {
              throw new Error('normalized hourly recovery evidence is malformed');
            }
            const validationEvidence = JSON.parse(
              Buffer.from(encoded, 'base64').toString('utf8'),
            );
            const validationStateSha = validationEvidence.stateSha || '';
            const validationCodeSha = validationEvidence.codeSha || '';
            const {
              closeHourlyIncident,
              validateSiteHealthEvidence,
            } = require(
              `${process.env.GITHUB_WORKSPACE}/scripts/vllm/hourly_incident_recovery.js`,
            );
            validateSiteHealthEvidence(
              validationEvidence,
              validationStateSha,
              validationCodeSha,
            );

            const sha40 = value => typeof value === 'string' &&
              /^[0-9a-f]{40}$/.test(value);
            const sha64 = value => typeof value === 'string' &&
              /^[0-9a-f]{64}$/.test(value);
            const generation = value => typeof value === 'string' &&
              /^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$/.test(value);
            const exactKeys = (value, keys) => value &&
              typeof value === 'object' && !Array.isArray(value) &&
              Object.keys(value).sort().join('\n') === keys.slice().sort().join('\n');
            const readPublicJson = async (path, maxBytes) => {
              const response = await github.rest.repos.getContent({
                ...context.repo,
                path,
                ref: 'gh-pages',
              });
              const file = response.data;
              if (!file || Array.isArray(file) || file.type !== 'file' ||
                  file.encoding !== 'base64' ||
                  typeof file.content !== 'string' ||
                  !Number.isSafeInteger(file.size) || file.size > maxBytes) {
                throw new Error(`canonical ${path} response is malformed or oversized`);
              }
              const raw = Buffer.from(file.content, 'base64');
              if (raw.length !== file.size || raw.length > maxBytes) {
                throw new Error(`canonical ${path} bytes do not match their bound`);
              }
              const parsed = JSON.parse(raw.toString('utf8'));
              if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
                throw new Error(`canonical ${path} is not a JSON object`);
              }
              return parsed;
            };

            const marker = await readPublicJson('publication_generation.json', 16384);
            const status = await readPublicJson(
              'data/vllm/ci/publication_status.json',
              16384,
            );
            const projection = marker.public_projection;
            if (!exactKeys(marker, [
              'schema_version', 'generation_id', 'generated_at', 'state_sha',
              'state_tree', 'code_sha', 'public_projection',
            ]) || marker.schema_version !== 2 ||
                !generation(marker.generation_id) ||
                !sha40(marker.state_sha) || !sha40(marker.state_tree) ||
                !sha40(marker.code_sha) ||
                !exactKeys(projection, [
                  'schema_version', 'manifest_path', 'manifest_sha256',
                  'file_count', 'total_bytes',
                ]) || projection.schema_version !== 1 ||
                projection.manifest_path !== 'publication_manifest.json' ||
                !sha64(projection.manifest_sha256) ||
                !Number.isSafeInteger(projection.file_count) ||
                projection.file_count < 1 ||
                !Number.isSafeInteger(projection.total_bytes) ||
                projection.total_bytes < 1) {
              throw new Error('canonical publication generation is invalid');
            }
            if (!exactKeys(status, [
              'schema_version', 'status', 'mode', 'generated_at',
              'degraded_since', 'uses_fallback', 'publication_blocked',
              'affected_surfaces', 'affected_surface_count',
              'fallback_surface_count', 'fresh_degraded_surface_count',
            ]) || status.schema_version !== 1 || status.status !== 'healthy' ||
                status.mode !== 'current' || status.generated_at !== marker.generated_at ||
                status.degraded_since !== null || status.uses_fallback !== false ||
                status.publication_blocked !== false ||
                !Array.isArray(status.affected_surfaces) ||
                status.affected_surfaces.length !== 0 ||
                status.affected_surface_count !== 0 ||
                status.fallback_surface_count !== 0 ||
                status.fresh_degraded_surface_count !== 0) {
              throw new Error('canonical publication status is not healthy/current');
            }

            const identityStillCurrent =
              marker.generation_id === validationEvidence.generationId &&
              marker.generated_at === validationEvidence.generatedAt &&
              marker.state_sha === validationEvidence.stateSha &&
              marker.state_tree === validationEvidence.stateTree &&
              marker.code_sha === validationEvidence.codeSha &&
              projection.manifest_sha256 === validationEvidence.manifestSha256 &&
              projection.file_count === validationEvidence.fileCount &&
              projection.total_bytes === validationEvidence.totalBytes;
            if (!identityStillCurrent) {
              core.info(
                'The canonical publication advanced after the health probes; ' +
                'the stale proof will not mutate hourly incident state.',
              );
              return;
            }
            await closeHourlyIncident({
              github,
              context,
              core,
              validationSource: 'site-health',
              validationStateSha,
              validationCodeSha,
              validationEvidence,
            });
