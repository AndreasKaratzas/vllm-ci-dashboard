name: Queue Lifecycle Monitor (2h)

on:
  schedule:
    # Lifecycle queries are substantially heavier than point-in-time queue
    # metrics. Check the durable gate every 30 minutes so a bounded private
    # checkpoint can resume promptly. Successful attempts remain hard-gated
    # to one per two hours, so the extra schedules make zero Buildkite calls.
    - cron: '17,47 * * * *'
  repository_dispatch:
    # Optional external wake-up; the durable attempt ledger still enforces the
    # success/retry cadences and rolling Buildkite request ceiling.
    types: [queue_lifecycle_tick]
  workflow_dispatch:

concurrency:
  group: queue-lifecycle-data-publish
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      LIFECYCLE_CHECKPOINT: data/vllm/ci/.cache/queue-lifecycle-wip-v1/checkpoint.json.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Reserve guarded Queue Lifecycle attempt
        id: request-attempt
        env:
          ATTEMPT_ID: lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          OUTPUTS="$RUNNER_TEMP/queue-lifecycle-attempt.outputs"
          : > "$OUTPUTS"
          python3 scripts/vllm/request_bearing_attempt_budget.py \
            --config config/queue_lifecycle_attempt_budget.json reserve \
            --attempt-id "$ATTEMPT_ID" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-attempt "${{ github.run_attempt }}" \
            --event-name "${{ github.event_name }}" \
            --github-output "$OUTPUTS"
          REQUEST_MODE=$(awk -F= '$1 == "request_mode" {print $2}' "$OUTPUTS")
          ALLOWANCE=$(awk -F= '$1 == "request_start_allowance" {print $2}' "$OUTPUTS")
          if [[ ! "$REQUEST_MODE" =~ ^(reserved|success_gated|retry_gated|cap_gated)$ ]] || \
             [ "$ALLOWANCE" != 100 ]; then
            echo "::error::Attempt ledger returned malformed gate outputs."
            exit 1
          fi
          cat "$OUTPUTS" >> "$GITHUB_OUTPUT"

      - name: Report bounded request gate
        if: steps.request-attempt.outputs.request_mode != 'reserved'
        run: >-
          echo "Queue lifecycle made zero Buildkite requests:
          ${{ steps.request-attempt.outputs.request_mode }} until
          ${{ steps.request-attempt.outputs.available_at }}."

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: steps.request-attempt.outputs.request_mode == 'reserved'
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: |
            constraints.txt
            pyproject.toml

      - name: Install dependencies
        if: steps.request-attempt.outputs.request_mode == 'reserved'
        run: pip install -c constraints.txt requests

      - name: Initialize exact Buildkite request guard
        if: steps.request-attempt.outputs.request_mode == 'reserved'
        env:
          ATTEMPT_ID: lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          ALLOWANCE: ${{ steps.request-attempt.outputs.request_start_allowance }}
        run: |
          set -euo pipefail
          GUARD_FILE="$RUNNER_TEMP/lifecycle-buildkite-request-guard-${{ github.run_id }}-${{ github.run_attempt }}.json"
          python scripts/vllm/buildkite_request_guard.py initialize \
            --file "$GUARD_FILE" \
            --attempt-id "$ATTEMPT_ID" \
            --allowance "$ALLOWANCE"
          {
            echo "BUILDKITE_REQUEST_GUARD_FILE=$GUARD_FILE"
            echo "BUILDKITE_REQUEST_GUARD_ATTEMPT_ID=$ATTEMPT_ID"
            echo "BUILDKITE_REQUEST_GUARD_ALLOWANCE=$ALLOWANCE"
          } >> "$GITHUB_ENV"

      - name: Restore durable lifecycle observations
        id: lifecycle-baseline
        if: steps.request-attempt.outputs.request_mode == 'reserved'
        run: |
          # A missing branch is the expected first-run bootstrap. Every other
          # lookup/fetch/read failure is fatal: publishing an empty orphan
          # branch over established evidence would make the ledger unrecoverable.
          set +e
          LIFECYCLE_REMOTE=$(git ls-remote --exit-code --refs origin refs/heads/queue-lifecycle-data)
          LIFECYCLE_DATA_STATUS=$?
          set -e
          if [ "$LIFECYCLE_DATA_STATUS" -eq 0 ]; then
            read -r LIFECYCLE_DATA_SHA LIFECYCLE_DATA_REF EXTRA <<< "$LIFECYCLE_REMOTE"
            if ! [[ "$LIFECYCLE_DATA_SHA" =~ ^[0-9a-f]{40}$ ]] || \
               [ "$LIFECYCLE_DATA_REF" != refs/heads/queue-lifecycle-data ] || \
               [ -n "${EXTRA:-}" ]; then
              echo "::error::Lifecycle branch lookup returned an ambiguous ref."
              exit 1
            fi
            git fetch origin \
              +refs/heads/queue-lifecycle-data:refs/remotes/origin/queue-lifecycle-data \
              --depth=1
            if [ "$(git rev-parse --verify 'origin/queue-lifecycle-data^{commit}')" != \
                 "$LIFECYCLE_DATA_SHA" ]; then
              echo "::error::Fetched lifecycle baseline moved during exact restore."
              exit 1
            fi
            python scripts/vllm/collect_queue_lifecycle.py \
              --restore-jobs-git-ref origin/queue-lifecycle-data
            echo "baseline_ref=$LIFECYCLE_DATA_SHA" >> "$GITHUB_OUTPUT"
          elif [ "$LIFECYCLE_DATA_STATUS" -eq 2 ]; then
            echo "No queue-lifecycle-data branch exists; starting the first bounded bootstrap."
            echo "baseline_ref=bootstrap" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not determine durable lifecycle branch state; refusing to publish."
            exit "$LIFECYCLE_DATA_STATUS"
          fi

      # LIFECYCLE-WIP-CACHE-BOUNDARY: the checkpoint contains only hashed,
      # schema-validated observations and exact half-open query-unit cursors.
      # It is gitignored and never installed into the durable data branch.
      - name: Prepare private lifecycle WIP cache key
        id: lifecycle-wip-cache-key
        if: steps.request-attempt.outputs.request_mode == 'reserved'
        shell: bash
        run: |
          set -euo pipefail
          CACHE_NAMESPACE="queue-lifecycle-wip-v1-${{ runner.os }}"
          {
            echo "key=$CACHE_NAMESPACE-${{ github.run_id }}-${{ github.run_attempt }}"
            echo "namespace_prefix=$CACHE_NAMESPACE-"
          } >> "$GITHUB_OUTPUT"

      - name: Restore newest private lifecycle WIP
        if: steps.request-attempt.outputs.request_mode == 'reserved'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: data/vllm/ci/.cache/queue-lifecycle-wip-v1
          key: ${{ steps.lifecycle-wip-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.lifecycle-wip-cache-key.outputs.namespace_prefix }}

      - name: Collect canonical AMD queue lifecycle
        id: collect-lifecycle
        # Independent backstop for interpreter/setup drift around the
        # collector's 40-minute internal monotonic deadline.
        timeout-minutes: 44
        if: steps.request-attempt.outputs.request_mode == 'reserved'
        env:
          BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_TOKEN }}
          LIFECYCLE_BASELINE_REF: ${{ steps.lifecycle-baseline.outputs.baseline_ref }}
        run: |
          # Exit 75 means the exact request-start allowance was consumed with
          # incomplete validated WIP. Exit 76 means the 40-minute collection
          # budget ended with validated WIP, which may already be complete.
          # Both are successful private progress; every other non-zero status
          # remains a hard workflow failure.
          set +e
          python scripts/vllm/collect_queue_lifecycle.py \
            --checkpoint "$LIFECYCLE_CHECKPOINT" \
            --baseline-ref "$LIFECYCLE_BASELINE_REF"
          LIFECYCLE_STATUS=$?
          set -e
          if [ "$LIFECYCLE_STATUS" -eq 0 ]; then
            echo "collection_complete=true" >> "$GITHUB_OUTPUT"
          elif [ "$LIFECYCLE_STATUS" -eq 75 ]; then
            echo "collection_complete=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Lifecycle collection used its request allowance and saved resumable progress."
          elif [ "$LIFECYCLE_STATUS" -eq 76 ]; then
            echo "collection_complete=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Lifecycle collection reached its wall-clock budget and saved validated progress."
          else
            exit "$LIFECYCLE_STATUS"
          fi

      - name: Read exact guarded Buildkite request total
        id: request-guard-report
        if: >-
          always() &&
          steps.request-attempt.outputs.request_mode == 'reserved'
        run: |
          set -euo pipefail
          python scripts/vllm/buildkite_request_guard.py report \
            --file "$BUILDKITE_REQUEST_GUARD_FILE" \
            --attempt-id "$BUILDKITE_REQUEST_GUARD_ATTEMPT_ID" \
            --allowance "$BUILDKITE_REQUEST_GUARD_ALLOWANCE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate retained lifecycle evidence
        id: lifecycle-validation
        if: >-
          steps.request-attempt.outputs.request_mode == 'reserved' &&
          steps.collect-lifecycle.outputs.collection_complete == 'true' &&
          steps.request-guard-report.outcome == 'success'
        run: |
          python -m json.tool data/vllm/ci/queue_lifecycle.json >/dev/null
          if [ -d data/vllm/ci/queue_lifecycle_jobs ]; then
            find data/vllm/ci/queue_lifecycle_jobs -type f -name '*.jsonl.gz' -print0 \
              | xargs -0 -r gzip -t
          fi
          python scripts/vllm/collect_queue_lifecycle.py --validate-ledger-only
          python -S scripts/vllm/audit_dashboard_data.py --queue-lifecycle-only

      - name: Publish durable lifecycle evidence
        id: lifecycle-publication
        if: >-
          steps.request-attempt.outputs.request_mode == 'reserved' &&
          steps.collect-lifecycle.outputs.collection_complete == 'true' &&
          steps.request-guard-report.outcome == 'success' &&
          steps.lifecycle-validation.outcome == 'success'
        env:
          LIFECYCLE_BASELINE_REF: ${{ steps.lifecycle-baseline.outputs.baseline_ref }}
        run: |
          # Only the bounded public aggregate and privacy-minimized compressed
          # observations are retained on this single-commit orphan branch.
          LIVE_ROOT=$(mktemp -d)
          cleanup() {
            git worktree remove --force "$LIVE_ROOT" 2>/dev/null || true
            rm -rf "$LIVE_ROOT"
          }
          trap cleanup EXIT
          git worktree add --detach "$LIVE_ROOT" HEAD
          git -C "$LIVE_ROOT" switch --orphan queue-lifecycle-data-publish
          git -C "$LIVE_ROOT" rm -rf --ignore-unmatch .
          install -D -m 0644 data/vllm/ci/queue_lifecycle.json \
            "$LIVE_ROOT/data/vllm/ci/queue_lifecycle.json"
          while IFS= read -r -d '' SEGMENT; do
            install -D -m 0644 "$SEGMENT" "$LIVE_ROOT/$SEGMENT"
          done < <(find data/vllm/ci/queue_lifecycle_jobs -type f -name '*.jsonl.gz' -print0)
          git -C "$LIVE_ROOT" config user.name "github-actions[bot]"
          git -C "$LIVE_ROOT" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$LIVE_ROOT" add --all data/vllm/ci
          python "$GITHUB_WORKSPACE/scripts/vllm/check_git_blob_sizes.py" --root "$LIVE_ROOT"
          git -C "$LIVE_ROOT" commit -m "queue: lifecycle observations $(date -u +%Y-%m-%dT%H:%M)"
          DURABLE_REF=$(git -C "$LIVE_ROOT" rev-parse --verify 'HEAD^{commit}')
          if [ "$LIFECYCLE_BASELINE_REF" = bootstrap ]; then
            LIFECYCLE_LEASE="--force-with-lease=refs/heads/queue-lifecycle-data:"
          elif [[ "$LIFECYCLE_BASELINE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            LIFECYCLE_LEASE="--force-with-lease=refs/heads/queue-lifecycle-data:$LIFECYCLE_BASELINE_REF"
          else
            echo "::error::Lifecycle publication baseline ref is invalid."
            exit 1
          fi
          git -C "$LIVE_ROOT" push "$LIFECYCLE_LEASE" origin HEAD:queue-lifecycle-data
          REMOTE_REF=$(git ls-remote --refs origin refs/heads/queue-lifecycle-data | awk '{print $1}')
          if ! [[ "$DURABLE_REF" =~ ^[0-9a-f]{40}$ ]] || \
             [ "$REMOTE_REF" != "$DURABLE_REF" ]; then
            echo "::error::Published lifecycle ref does not match its exact local commit."
            exit 1
          fi
          echo "durable_ref=$DURABLE_REF" >> "$GITHUB_OUTPUT"

      - name: Mark durable Queue Lifecycle success
        if: steps.lifecycle-publication.outputs.durable_ref != ''
        env:
          DURABLE_REF: ${{ steps.lifecycle-publication.outputs.durable_ref }}
          ACTUAL_REQUEST_STARTS: ${{ steps.request-guard-report.outputs.actual_request_starts }}
        run: |
          set -euo pipefail
          for MARK_ATTEMPT in 1 2 3; do
            if python scripts/vllm/request_bearing_attempt_budget.py \
              --config config/queue_lifecycle_attempt_budget.json mark-success \
              --attempt-id "$BUILDKITE_REQUEST_GUARD_ATTEMPT_ID" \
              --durable-ref "$DURABLE_REF" \
              --actual-request-starts "$ACTUAL_REQUEST_STARTS"; then
              exit 0
            fi
            if [ "$MARK_ATTEMPT" -lt 3 ]; then sleep $((MARK_ATTEMPT * 2)); fi
          done
          echo "::error::Lifecycle data published, but its durable attempt success could not be recorded."
          exit 1

      - name: Clear published lifecycle WIP
        if: steps.lifecycle-publication.outputs.durable_ref != ''
        run: >-
          python scripts/vllm/collect_queue_lifecycle.py
          --checkpoint "$LIFECYCLE_CHECKPOINT"
          --clear-checkpoint

      - name: Prepare bounded private lifecycle cache payload
        id: lifecycle-wip-cache-payload
        if: >-
          always() &&
          steps.request-attempt.outputs.request_mode == 'reserved'
        run: >-
          python scripts/vllm/collect_queue_lifecycle.py
          --checkpoint "$LIFECYCLE_CHECKPOINT"
          --prepare-checkpoint-cache

      - name: Save private lifecycle recovery checkpoint
        if: >-
          always() &&
          steps.request-attempt.outputs.request_mode == 'reserved' &&
          steps.lifecycle-wip-cache-payload.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: data/vllm/ci/.cache/queue-lifecycle-wip-v1
          key: ${{ steps.lifecycle-wip-cache-key.outputs.key }}

      - name: Prune superseded private lifecycle caches
        if: >-
          always() &&
          steps.request-attempt.outputs.request_mode == 'reserved'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CACHE_IDS="$RUNNER_TEMP/lifecycle-wip-cache-ids.txt"
          gh cache list \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF" \
            --key "queue-lifecycle-wip-v1-${{ runner.os }}-" \
            --sort created_at \
            --order desc \
            --limit 100 \
            --json id \
            --jq '.[8:] | .[].id' > "$CACHE_IDS"
          while IFS= read -r CACHE_ID; do
            if [[ "$CACHE_ID" =~ ^[0-9]+$ ]]; then
              gh cache delete "$CACHE_ID" --repo "$GITHUB_REPOSITORY"
            fi
          done < "$CACHE_IDS"
