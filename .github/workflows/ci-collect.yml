name: CI Data Collection (Validation Only)

# Legacy/manual focused CI collector. This is validation-only: the authoritative
# hourly-master workflow owns source selection, main writes, and Pages publication.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Days of history to fetch'
        required: false
        default: '1'
      pipeline:
        description: 'Pipeline to collect (amd/upstream/both)'
        required: false
        default: 'both'

concurrency:
  group: ci-collect-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Collect CI data
        run: |
          # Default to 1 day for scheduled/webhook runs; manual dispatch can override
          DAYS="${{ github.event.inputs.days || '1' }}"
          PIPELINE="${{ github.event.inputs.pipeline || 'both' }}"
          python scripts/collect_ci.py --days "$DAYS" --pipeline "$PIPELINE" --output data/vllm/ci/
        env:
          BUILDKITE_TOKEN: ${{ secrets.BUILDKITE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect CI analytics
        run: python scripts/vllm/collect_analytics.py --days 30 --output data/vllm/ci/
        env:
          BUILDKITE_TOKEN: ${{ secrets.BUILDKITE_TOKEN }}

      - name: Collect AMD gating target list
        run: python scripts/vllm/collect_gating_targets.py --output data/vllm/ci/

      - name: Collect test group changes
        run: python scripts/vllm/collect_group_changes.py --days 30 --output data/vllm/ci/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect AMD test matrix
        run: python scripts/vllm/collect_amd_test_matrix.py --output data/vllm/ci/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect AMD gating proposals
        run: python scripts/vllm/collect_gating_proposals.py --output data/vllm/ci/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect AMD gating target candidate audit
        run: python scripts/vllm/collect_gating_target_candidates.py --output data/vllm/ci/

      - name: Build v2 operations snapshot
        run: python scripts/vllm/build_operations_snapshot.py --input-dir data/vllm/ci --output data/vllm/ci/operations_v2.json

      - name: Report validation-only collection
        run: |
          echo "## Validation-only CI collection" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow does not commit, push, or publish collected data." >> "$GITHUB_STEP_SUMMARY"
          echo "Run the authoritative Data Collection workflow to select publication surfaces and update main." >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          git status --short -- data/vllm/ci/ data/vllm/test_results.json data/vllm/parity_report.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
