name: CI Data Collection

# Legacy/manual focused CI collector. The authoritative hourly-master workflow
# owns Buildkite completion events and all root GitHub Pages publication.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Days of history to fetch'
        required: false
        default: '1'
      pipeline:
        description: 'Pipeline to collect (amd/upstream/both)'
        required: false
        default: 'both'

concurrency:
  # Serialize its main-branch data commit with the canonical collector.
  group: gh-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Collect CI data
        run: |
          # Default to 1 day for scheduled/webhook runs; manual dispatch can override
          DAYS="${{ github.event.inputs.days || '1' }}"
          PIPELINE="${{ github.event.inputs.pipeline || 'both' }}"
          python scripts/collect_ci.py --days "$DAYS" --pipeline "$PIPELINE" --output data/vllm/ci/
        env:
          BUILDKITE_TOKEN: ${{ secrets.BUILDKITE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect CI analytics
        run: python scripts/vllm/collect_analytics.py --days 30 --output data/vllm/ci/
        env:
          BUILDKITE_TOKEN: ${{ secrets.BUILDKITE_TOKEN }}

      - name: Collect AMD gating target list
        run: python scripts/vllm/collect_gating_targets.py --output data/vllm/ci/

      - name: Collect test group changes
        run: python scripts/vllm/collect_group_changes.py --days 30 --output data/vllm/ci/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect AMD test matrix
        run: python scripts/vllm/collect_amd_test_matrix.py --output data/vllm/ci/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect AMD gating proposals
        run: python scripts/vllm/collect_gating_proposals.py --output data/vllm/ci/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect AMD gating target candidate audit
        run: python scripts/vllm/collect_gating_target_candidates.py --output data/vllm/ci/

      - name: Build v2 operations snapshot
        run: python scripts/vllm/build_operations_snapshot.py --input-dir data/vllm/ci --output data/vllm/ci/operations_v2.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vllm/ci/ data/vllm/test_results.json data/vllm/parity_report.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: update vLLM CI data $(date -u +%Y-%m-%d)"
            # Push to main is best-effort — branch protection may block it.
            # Root publication is deliberately owned by hourly-master.
            if git pull --rebase origin main; then
              git push || echo "::warning::Push to main failed (branch protection). Run hourly-master to recollect and publish."
            else
              git rebase --abort || true
              echo "::warning::Rebase against origin/main failed; no data was published."
            fi
          fi
