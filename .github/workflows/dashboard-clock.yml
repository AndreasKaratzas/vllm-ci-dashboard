name: Dashboard Clock

# GitHub delivers only a few schedule events per workflow each day, but
# GITHUB_TOKEN workflow_dispatch reliably starts runs. Each run wakes the fixed
# recovery profiles for 5.5 hours and then dispatches its successor; the cron
# only revives a broken chain. One running and one pending run cap the chain,
# and a run that fails early waits out the watchdog's 20-minute spacing before
# handing off, so a persistent failure cannot hot-loop.
# Disable this workflow to stop the chain.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: dashboard-clock
  cancel-in-progress: false

permissions: {}

jobs:
  tick:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      actions: write
      contents: read
    steps:
      - name: Record the clock start
        run: echo "CLOCK_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up exact Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.13'

      - name: Wake guarded workflows on their fixed profiles
        id: loop
        timeout-minutes: 335
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/vllm/external_recovery_tick.py --github-actions-loop --duration-seconds 19800

      - name: Dispatch the next clock run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LOOP_OUTCOME: ${{ steps.loop.outcome }}
        run: |
          set -euo pipefail
          if [ "$LOOP_OUTCOME" != success ]; then
            WAIT=$((CLOCK_STARTED + 1200 - $(date +%s)))
            if [ "$WAIT" -gt 0 ]; then sleep "$WAIT"; fi
          fi
          for DELAY in 10 30 0; do
            if gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/workflows/dashboard-clock.yml/dispatches" \
              -f ref=main; then
              echo "Dispatched the next Dashboard Clock run."
              exit 0
            fi
            sleep "$DELAY"
          done
          echo "::error::Could not dispatch the next Dashboard Clock run; the hourly schedule must revive the chain."
          exit 1
