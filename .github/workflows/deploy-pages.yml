name: Deploy to GitHub Pages

on:
  workflow_dispatch:  # Manual trigger only; scheduled deploys are owned by hourly-master

concurrency:
  group: gh-pages-deploy
  queue: max
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Sync live data from gh-pages
        run: |
          # queue-data owns independent queue history; gh-pages remains the
          # source for other live datasets and a queue migration fallback.
          git fetch origin \
            +refs/heads/queue-data:refs/remotes/origin/queue-data \
            --depth=1 || true
          git fetch origin \
            +refs/heads/queue-lifecycle-data:refs/remotes/origin/queue-lifecycle-data \
            --depth=1 || true
          git fetch origin \
            +refs/heads/dns-health-data:refs/remotes/origin/dns-health-data \
            --depth=1 || true
          git fetch origin \
            +refs/heads/gh-pages:refs/remotes/origin/gh-pages \
            --depth=1 || true

          if git rev-parse --verify --quiet origin/queue-data >/dev/null; then
            python scripts/vllm/collect_queue_snapshot.py --merge-history-git-ref origin/queue-data
            LIVE_QUEUE_JOBS="$RUNNER_TEMP/queue_jobs.json"
            git show origin/queue-data:data/vllm/ci/queue_jobs.json > "$LIVE_QUEUE_JOBS"
            python -m json.tool "$LIVE_QUEUE_JOBS" >/dev/null
            install -m 0644 "$LIVE_QUEUE_JOBS" data/vllm/ci/queue_jobs.json
          fi

          if git rev-parse --verify --quiet origin/queue-lifecycle-data >/dev/null; then
            LIVE_QUEUE_LIFECYCLE="$RUNNER_TEMP/queue_lifecycle.json"
            if git show origin/queue-lifecycle-data:data/vllm/ci/queue_lifecycle.json > "$LIVE_QUEUE_LIFECYCLE" 2>/dev/null \
              && python -m json.tool "$LIVE_QUEUE_LIFECYCLE" >/dev/null; then
              install -m 0644 "$LIVE_QUEUE_LIFECYCLE" data/vllm/ci/queue_lifecycle.json
            else
              echo "::warning::queue-lifecycle-data has no valid aggregate; keeping the main-branch copy."
            fi
          fi

          if git rev-parse --verify --quiet origin/dns-health-data >/dev/null; then
            LIVE_DNS_FAILURES="$RUNNER_TEMP/dns_failures.json"
            if git show origin/dns-health-data:data/vllm/ci/dns_failures.json > "$LIVE_DNS_FAILURES" 2>/dev/null \
              && python -m json.tool "$LIVE_DNS_FAILURES" >/dev/null \
              && python scripts/vllm/audit_dashboard_data.py --dns-only --dns-path "$LIVE_DNS_FAILURES"; then
              read -r REMOTE_DNS_STATUS REMOTE_DNS_GENERATED < <(
                python -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d["coverage"]["status"], d["generated_at"])' \
                  "$LIVE_DNS_FAILURES"
              )
              read -r LOCAL_DNS_STATUS LOCAL_DNS_GENERATED < <(
                python -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d["coverage"]["status"], d["generated_at"])' \
                  data/vllm/ci/dns_failures.json
              )
              if [[ "$REMOTE_DNS_STATUS" =~ ^(complete|partial)$ && ! "$REMOTE_DNS_GENERATED" < "$LOCAL_DNS_GENERATED" ]]; then
                install -m 0644 "$LIVE_DNS_FAILURES" data/vllm/ci/dns_failures.json
              else
                echo "Keeping the newer or already-collected main-branch DNS aggregate."
              fi
            else
              echo "::warning::dns-health-data has no valid aggregate; keeping the main-branch copy."
            fi
          fi

          # A corrupt legacy Pages copy must not block the independent branch.
          CORRUPT=$(git show origin/gh-pages:data/vllm/ci/ci_health.json 2>/dev/null | head -5 | grep -c "^>>>>>>>\|^<<<<<<<\|^=======" || true)
          if [ "$CORRUPT" -gt 0 ]; then
            echo "WARNING: gh-pages data is corrupted; keeping queue-data plus main inputs."
          else
            # Merge data/vllm/ci/queue_timeseries.jsonl by timestamp. The
            # collector rejects conflict markers and normalizes legacy rows.
            python scripts/vllm/collect_queue_snapshot.py --merge-history-git-ref origin/gh-pages
            # CI analysis JSON files are committed to main by hourly-master.
            # Do NOT sync from gh-pages — main always has the latest data.
            echo "Skipping CI JSON sync — main branch is authoritative."
          fi

      - name: Prune queue history to post-fix baseline
        run: python scripts/vllm/collect_queue_snapshot.py --prune-only

      - name: Render site data
        run: python scripts/render.py

      - name: Rebuild v2 operations snapshot
        run: python scripts/vllm/build_operations_snapshot.py --input-dir data/vllm/ci --output data/vllm/ci/operations_v2.json

      - name: Run dashboard data audit
        run: python scripts/vllm/audit_dashboard_data.py

      - name: Assemble site
        run: python scripts/build_site.py --cache-bust-index

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          # A manual full deployment is also an authoritative branch rebuild.
          keep_files: false
          force_orphan: true

      - name: Post-deploy validation
        id: post-deploy-validation
        run: |
          git fetch origin \
            +refs/heads/gh-pages:refs/remotes/origin/gh-pages \
            --depth=1 2>/dev/null || true
          CORRUPT=0
          for f in $(git ls-tree -r --name-only origin/gh-pages -- data/ 2>/dev/null | grep '\.json$\|\.jsonl$'); do
            CONTENT=$(git show "origin/gh-pages:$f" 2>/dev/null || true)
            if echo "$CONTENT" | grep -q "^>>>>>>>\|^<<<<<<<\|^======="; then
              echo "CORRUPT: $f"
              CORRUPT=$((CORRUPT + 1))
            fi
          done
          if [ "$CORRUPT" -gt 0 ]; then
            echo "::error::$CORRUPT files corrupted on gh-pages! Redeploying without keep_files..."
            exit 1
          fi

          DEPLOYED_ORG_SUMMARY="$RUNNER_TEMP/deployed-org-summary.json"
          if ! git show origin/gh-pages:data/vllm/ci/org_summary.json \
            > "$DEPLOYED_ORG_SUMMARY" 2>/dev/null; then
            echo "::error::Published org_summary.json is missing."
            exit 1
          fi
          python -m json.tool "$DEPLOYED_ORG_SUMMARY" >/dev/null
          cmp -s _site/data/vllm/ci/org_summary.json "$DEPLOYED_ORG_SUMMARY" || {
            echo "::error::Published org_summary.json differs from the assembled site."
            exit 1
          }

          DEPLOYED_OPERATIONS_MANIFEST="$RUNNER_TEMP/deployed-operations-manifest.json"
          if ! git show \
            origin/gh-pages:data/vllm/ci/operations_v2_manifest.json \
            > "$DEPLOYED_OPERATIONS_MANIFEST" 2>/dev/null; then
            echo "::error::Published Operations manifest is missing."
            exit 1
          fi
          python scripts/vllm/verify_published_operations_bundle.py \
            --assembled-manifest _site/data/vllm/ci/operations_v2_manifest.json \
            --deployed-manifest "$DEPLOYED_OPERATIONS_MANIFEST" \
            --git-ref origin/gh-pages
          echo "All data files and publication bundles are clean."

      - name: Redeploy if corrupted
        id: corruption-redeploy
        if: failure() && steps.post-deploy-validation.outcome == 'failure' && hashFiles('_site/index.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false
          force_orphan: true

      - name: Confirm corruption recovery
        if: always() && steps.post-deploy-validation.outcome == 'failure' && steps.corruption-redeploy.outcome == 'success'
        run: |
          set -euo pipefail
          git fetch origin \
            +refs/heads/gh-pages:refs/remotes/origin/gh-pages \
            --depth=1

          CORRUPT=0
          for f in $(git ls-tree -r --name-only origin/gh-pages -- data/ 2>/dev/null | grep '\.json$\|\.jsonl$' || true); do
            CONTENT=$(git show "origin/gh-pages:$f" 2>/dev/null || true)
            if echo "$CONTENT" | grep -q "^>>>>>>>\|^<<<<<<<\|^======="; then
              echo "CORRUPT after recovery: $f"
              CORRUPT=$((CORRUPT + 1))
            fi
          done
          if [ "$CORRUPT" -gt 0 ]; then
            echo "::error::$CORRUPT data files remain corrupted after recovery deployment."
            exit 1
          fi

          DEPLOYED_ORG_SUMMARY="$RUNNER_TEMP/recovered-org-summary.json"
          git show origin/gh-pages:data/vllm/ci/org_summary.json \
            > "$DEPLOYED_ORG_SUMMARY"
          python -m json.tool "$DEPLOYED_ORG_SUMMARY" >/dev/null
          cmp -s _site/data/vllm/ci/org_summary.json "$DEPLOYED_ORG_SUMMARY"

          DEPLOYED_OPERATIONS_MANIFEST="$RUNNER_TEMP/recovered-operations-manifest.json"
          git show \
            origin/gh-pages:data/vllm/ci/operations_v2_manifest.json \
            > "$DEPLOYED_OPERATIONS_MANIFEST"
          python scripts/vllm/verify_published_operations_bundle.py \
            --assembled-manifest _site/data/vllm/ci/operations_v2_manifest.json \
            --deployed-manifest "$DEPLOYED_OPERATIONS_MANIFEST" \
            --git-ref origin/gh-pages
          echo "Confirmed clean JSON data and restored critical publication bundles."
