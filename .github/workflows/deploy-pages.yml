name: Deploy to GitHub Pages

on:
  workflow_dispatch:  # Manual trigger only; scheduled deploys are owned by hourly-master

concurrency:
  group: gh-pages-deploy
  queue: max
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Sync live data from gh-pages
        run: |
          # queue-data owns independent queue history; gh-pages remains the
          # source for other live datasets and a queue migration fallback.
          # A branch that genuinely does not exist is a valid first bootstrap.
          # Once it exists, transport/read failures are fatal: silently using a
          # stale main copy would make a manual recovery deployment regress.
          fetch_live_branch() {
            BRANCH="$1"
            set +e
            git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1
            STATUS=$?
            set -e
            if [ "$STATUS" -eq 0 ]; then
              if ! git fetch origin \
                "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" \
                --depth=1; then
                echo "::error::Could not fetch established durable $BRANCH branch."
                return 1
              fi
              return 0
            fi
            if [ "$STATUS" -eq 2 ]; then
              return 2
            fi
            echo "::error::Could not determine durable $BRANCH branch state."
            return "$STATUS"
          }

          QUEUE_DATA_PRESENT=false
          if fetch_live_branch queue-data; then
            QUEUE_DATA_PRESENT=true
          elif [ "$?" -ne 2 ]; then
            exit 1
          fi
          LIFECYCLE_DATA_PRESENT=false
          if fetch_live_branch queue-lifecycle-data; then
            LIFECYCLE_DATA_PRESENT=true
          elif [ "$?" -ne 2 ]; then
            exit 1
          fi
          DNS_DATA_PRESENT=false
          if fetch_live_branch dns-health-data; then
            DNS_DATA_PRESENT=true
          elif [ "$?" -ne 2 ]; then
            exit 1
          fi
          PAGES_PRESENT=false
          if fetch_live_branch gh-pages; then
            PAGES_PRESENT=true
          elif [ "$?" -ne 2 ]; then
            exit 1
          fi

          if [ "$QUEUE_DATA_PRESENT" = true ]; then
            python scripts/vllm/collect_queue_snapshot.py \
              --merge-history-git-ref origin/queue-data \
              --require-merge-history
            LIVE_QUEUE_JOBS="$RUNNER_TEMP/queue_jobs.json"
            git show origin/queue-data:data/vllm/ci/queue_jobs.json > "$LIVE_QUEUE_JOBS"
            python - "$LIVE_QUEUE_JOBS" data/vllm/ci/queue_jobs.json <<'PY'
          import json
          import sys
          from datetime import datetime, timezone


          def load_snapshot(path: str, label: str) -> datetime:
              with open(path, encoding="utf-8") as handle:
                  payload = json.load(handle)
              if not isinstance(payload, dict):
                  raise SystemExit(f"{label} queue_jobs.json must be an object")
              for key in ("pending", "running"):
                  if not isinstance(payload.get(key), list):
                      raise SystemExit(
                          f"{label} queue_jobs.json field {key!r} must be a list"
                      )
              raw_timestamp = payload.get("ts")
              if not isinstance(raw_timestamp, str) or not raw_timestamp.strip():
                  raise SystemExit(f"{label} queue_jobs.json has no embedded timestamp")
              try:
                  parsed = datetime.fromisoformat(
                      raw_timestamp.strip().replace("Z", "+00:00")
                  )
              except ValueError as exc:
                  raise SystemExit(
                      f"{label} queue_jobs.json has an invalid embedded timestamp"
                  ) from exc
              if parsed.tzinfo is None:
                  raise SystemExit(
                      f"{label} queue_jobs.json embedded timestamp must include a timezone"
                  )
              return parsed.astimezone(timezone.utc)


          remote_timestamp = load_snapshot(sys.argv[1], "durable")
          local_timestamp = load_snapshot(sys.argv[2], "local")
          if remote_timestamp < local_timestamp:
              raise SystemExit(
                  "durable queue_jobs.json would regress the embedded timestamp: "
                  f"{remote_timestamp.isoformat()} < {local_timestamp.isoformat()}"
              )
          print(
              "Validated non-regressing durable queue_jobs.json: "
              f"{remote_timestamp.isoformat()} >= {local_timestamp.isoformat()}"
          )
          PY
            install -m 0644 "$LIVE_QUEUE_JOBS" data/vllm/ci/queue_jobs.json
          fi

          if [ "$LIFECYCLE_DATA_PRESENT" = true ]; then
            LIVE_QUEUE_LIFECYCLE="$RUNNER_TEMP/queue_lifecycle.json"
            git show origin/queue-lifecycle-data:data/vllm/ci/queue_lifecycle.json \
              > "$LIVE_QUEUE_LIFECYCLE"
            python -m json.tool "$LIVE_QUEUE_LIFECYCLE" >/dev/null
            python -S scripts/vllm/audit_dashboard_data.py \
              --queue-lifecycle-only \
              --queue-lifecycle-path "$LIVE_QUEUE_LIFECYCLE"
            python - "$LIVE_QUEUE_LIFECYCLE" data/vllm/ci/queue_lifecycle.json <<'PY'
          import json
          import sys
          from datetime import datetime, timezone


          def generated_at(path: str) -> datetime:
              with open(path, encoding="utf-8") as handle:
                  raw = json.load(handle)["generated_at"]
              parsed = datetime.fromisoformat(raw.replace("Z", "+00:00"))
              if parsed.tzinfo is None:
                  raise SystemExit(f"lifecycle generated_at has no timezone: {path}")
              return parsed.astimezone(timezone.utc)


          remote = generated_at(sys.argv[1])
          local = generated_at(sys.argv[2])
          if remote < local:
              raise SystemExit(
                  "durable lifecycle aggregate would regress generated_at: "
                  f"{remote.isoformat()} < {local.isoformat()}"
              )
          PY
            install -m 0644 "$LIVE_QUEUE_LIFECYCLE" data/vllm/ci/queue_lifecycle.json
          fi

          if [ "$DNS_DATA_PRESENT" = true ]; then
            LIVE_DNS_FAILURES="$RUNNER_TEMP/dns_failures.json"
            git show origin/dns-health-data:data/vllm/ci/dns_failures.json \
              > "$LIVE_DNS_FAILURES"
            python -m json.tool "$LIVE_DNS_FAILURES" >/dev/null
            python scripts/vllm/audit_dashboard_data.py \
              --dns-only --dns-path "$LIVE_DNS_FAILURES"
            read -r REMOTE_DNS_STATUS REMOTE_DNS_GENERATED < <(
              python -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d["coverage"]["status"], d["generated_at"])' \
                "$LIVE_DNS_FAILURES"
            )
            read -r LOCAL_DNS_STATUS LOCAL_DNS_GENERATED < <(
              python -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d["coverage"]["status"], d["generated_at"])' \
                data/vllm/ci/dns_failures.json
            )
            if [[ ! "$REMOTE_DNS_STATUS" =~ ^(complete|partial)$ ]]; then
              echo "::error::Established dns-health-data branch has no publishable aggregate."
              exit 1
            fi
            if [[ ! "$REMOTE_DNS_GENERATED" < "$LOCAL_DNS_GENERATED" ]]; then
              install -m 0644 "$LIVE_DNS_FAILURES" data/vllm/ci/dns_failures.json
            else
              echo "Keeping newer main-branch DNS aggregate from $LOCAL_DNS_GENERATED."
            fi
          fi

          # A corrupt legacy Pages copy must not block the independent branch.
          CORRUPT=0
          if [ "$PAGES_PRESENT" = true ]; then
            CORRUPT=$(git show origin/gh-pages:data/vllm/ci/ci_health.json 2>/dev/null | head -5 | grep -c "^>>>>>>>\|^<<<<<<<\|^=======" || true)
          fi
          if [ "$CORRUPT" -gt 0 ]; then
            echo "WARNING: gh-pages data is corrupted; keeping queue-data plus main inputs."
          elif [ "$PAGES_PRESENT" = true ]; then
            # Merge data/vllm/ci/queue_timeseries.jsonl by timestamp. The
            # collector rejects conflict markers and normalizes legacy rows.
            python scripts/vllm/collect_queue_snapshot.py --merge-history-git-ref origin/gh-pages
            # CI analysis JSON files are committed to main by hourly-master.
            # Do NOT sync from gh-pages — main always has the latest data.
            echo "Skipping CI JSON sync — main branch is authoritative."
          fi

      - name: Prune queue history to post-fix baseline
        run: python scripts/vllm/collect_queue_snapshot.py --prune-only

      - name: Render site data
        run: python scripts/render.py

      - name: Rebuild v2 operations snapshot
        run: python scripts/vllm/build_operations_snapshot.py --input-dir data/vllm/ci --output data/vllm/ci/operations_v2.json

      - name: Run dashboard data audit
        run: python scripts/vllm/audit_dashboard_data.py

      - name: Assemble site
        run: python scripts/build_site.py --cache-bust-index

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          # A manual full deployment is also an authoritative branch rebuild.
          keep_files: false
          force_orphan: true

      - name: Post-deploy validation
        id: post-deploy-validation
        run: |
          git fetch origin \
            +refs/heads/gh-pages:refs/remotes/origin/gh-pages \
            --depth=1 2>/dev/null || true
          CORRUPT=0
          for f in $(git ls-tree -r --name-only origin/gh-pages -- data/ 2>/dev/null | grep '\.json$\|\.jsonl$'); do
            CONTENT=$(git show "origin/gh-pages:$f" 2>/dev/null || true)
            if echo "$CONTENT" | grep -q "^>>>>>>>\|^<<<<<<<\|^======="; then
              echo "CORRUPT: $f"
              CORRUPT=$((CORRUPT + 1))
            fi
          done
          if [ "$CORRUPT" -gt 0 ]; then
            echo "::error::$CORRUPT files corrupted on gh-pages! Redeploying without keep_files..."
            exit 1
          fi

          DEPLOYED_ORG_SUMMARY="$RUNNER_TEMP/deployed-org-summary.json"
          if ! git show origin/gh-pages:data/vllm/ci/org_summary.json \
            > "$DEPLOYED_ORG_SUMMARY" 2>/dev/null; then
            echo "::error::Published org_summary.json is missing."
            exit 1
          fi
          python -m json.tool "$DEPLOYED_ORG_SUMMARY" >/dev/null
          cmp -s _site/data/vllm/ci/org_summary.json "$DEPLOYED_ORG_SUMMARY" || {
            echo "::error::Published org_summary.json differs from the assembled site."
            exit 1
          }

          DEPLOYED_OPERATIONS_MANIFEST="$RUNNER_TEMP/deployed-operations-manifest.json"
          if ! git show \
            origin/gh-pages:data/vllm/ci/operations_v2_manifest.json \
            > "$DEPLOYED_OPERATIONS_MANIFEST" 2>/dev/null; then
            echo "::error::Published Operations manifest is missing."
            exit 1
          fi
          python scripts/vllm/verify_published_operations_bundle.py \
            --assembled-manifest _site/data/vllm/ci/operations_v2_manifest.json \
            --deployed-manifest "$DEPLOYED_OPERATIONS_MANIFEST" \
            --git-ref origin/gh-pages
          echo "All data files and publication bundles are clean."

      - name: Redeploy if corrupted
        id: corruption-redeploy
        if: failure() && steps.post-deploy-validation.outcome == 'failure' && hashFiles('_site/index.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false
          force_orphan: true

      - name: Confirm corruption recovery
        if: always() && steps.post-deploy-validation.outcome == 'failure' && steps.corruption-redeploy.outcome == 'success'
        run: |
          set -euo pipefail
          git fetch origin \
            +refs/heads/gh-pages:refs/remotes/origin/gh-pages \
            --depth=1

          CORRUPT=0
          for f in $(git ls-tree -r --name-only origin/gh-pages -- data/ 2>/dev/null | grep '\.json$\|\.jsonl$' || true); do
            CONTENT=$(git show "origin/gh-pages:$f" 2>/dev/null || true)
            if echo "$CONTENT" | grep -q "^>>>>>>>\|^<<<<<<<\|^======="; then
              echo "CORRUPT after recovery: $f"
              CORRUPT=$((CORRUPT + 1))
            fi
          done
          if [ "$CORRUPT" -gt 0 ]; then
            echo "::error::$CORRUPT data files remain corrupted after recovery deployment."
            exit 1
          fi

          DEPLOYED_ORG_SUMMARY="$RUNNER_TEMP/recovered-org-summary.json"
          git show origin/gh-pages:data/vllm/ci/org_summary.json \
            > "$DEPLOYED_ORG_SUMMARY"
          python -m json.tool "$DEPLOYED_ORG_SUMMARY" >/dev/null
          cmp -s _site/data/vllm/ci/org_summary.json "$DEPLOYED_ORG_SUMMARY"

          DEPLOYED_OPERATIONS_MANIFEST="$RUNNER_TEMP/recovered-operations-manifest.json"
          git show \
            origin/gh-pages:data/vllm/ci/operations_v2_manifest.json \
            > "$DEPLOYED_OPERATIONS_MANIFEST"
          python scripts/vllm/verify_published_operations_bundle.py \
            --assembled-manifest _site/data/vllm/ci/operations_v2_manifest.json \
            --deployed-manifest "$DEPLOYED_OPERATIONS_MANIFEST" \
            --git-ref origin/gh-pages
          echo "Confirmed clean JSON data and restored critical publication bundles."
