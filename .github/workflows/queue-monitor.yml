name: Queue Monitor (10 minute)

on:
  schedule:
    # Keep queue metrics independent from the large dashboard build. A durable
    # parentless ledger coalesces all triggers to one two-start metrics allowance
    # per ten minutes and one additional twelve-start detail allowance per hour.
    # With a 25-hour hold, at most 650 reserved starts can be outstanding.
    - cron: '2,12,22,32,42,52 * * * *'
  repository_dispatch:
    # This is only a wake-up. It cannot bypass the durable cadence or budget.
    types: [buildkite_queue_changed]
  workflow_dispatch:

concurrency:
  # Queue evidence has a dedicated branch, so it can keep polling while the
  # much larger dashboard workflow holds the gh-pages deployment lock.
  group: queue-data-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    # The 25-hour ledger's one-hour cushion only proves a rolling-24h cap when
    # every request starts promptly after reservation. This job cannot retain a
    # permit for more than twenty minutes.
    timeout-minutes: 20
    env:
      # Import sitecustomize before every Python entry point. Once the durable
      # reservation initializes the guard environment, every Buildkite
      # transport start shares one fail-closed counter.
      PYTHONPATH: ${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.13'
          cache: 'pip'
          cache-dependency-path: |
            constraints.txt
            pyproject.toml

      - name: Install dependencies
        run: pip install -c constraints.txt requests pyyaml

      - name: Sync durable queue history
        run: |
          # queue-data is the independent source of truth. Keep the current
          # gh-pages copy only as a first-run migration source. A transport
          # failure while an established branch exists must fail closed; a
          # stale fallback followed by an orphan force-push would lose history.
          set +e
          git ls-remote --exit-code origin refs/heads/queue-data >/dev/null 2>&1
          QUEUE_DATA_STATUS=$?
          set -e
          if [ "$QUEUE_DATA_STATUS" -eq 0 ]; then
            git fetch origin \
              +refs/heads/queue-data:refs/remotes/origin/queue-data \
              --depth=1
            python scripts/vllm/collect_queue_snapshot.py \
              --merge-history-git-ref origin/queue-data \
              --require-merge-history
            git show \
              origin/queue-data:data/vllm/ci/queue_jobs.json \
              > data/vllm/ci/queue_jobs.json
            python -m json.tool data/vllm/ci/queue_jobs.json >/dev/null
          elif [ "$QUEUE_DATA_STATUS" -eq 2 ]; then
            git fetch origin \
              +refs/heads/gh-pages:refs/remotes/origin/gh-pages \
              --depth=1 || true
            if git rev-parse --verify --quiet origin/gh-pages >/dev/null; then
              python scripts/vllm/collect_queue_snapshot.py --merge-history-git-ref origin/gh-pages
              git show \
                origin/gh-pages:data/vllm/ci/queue_jobs.json \
                > data/vllm/ci/queue_jobs.json 2>/dev/null || true
            fi
          else
            echo "::error::Could not determine durable queue-data branch state; refusing to publish."
            exit "$QUEUE_DATA_STATUS"
          fi

      - name: Prune queue history to post-fix baseline
        run: python scripts/vllm/collect_queue_snapshot.py --prune-only

      - name: Reserve durable rolling queue request budget
        id: queue-request-budget
        env:
          ATTEMPT_ID: queue-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          OUTPUTS="$RUNNER_TEMP/queue-request-budget.outputs"
          : > "$OUTPUTS"
          python scripts/vllm/queue_request_budget.py reserve \
            --reservation-id "$ATTEMPT_ID" \
            --github-output "$OUTPUTS"
          REQUEST_MODE=$(awk -F= '$1 == "request_mode" {print $2}' "$OUTPUTS")
          ALLOWANCE=$(awk -F= '$1 == "reserved_request_starts" {print $2}' "$OUTPUTS")
          METRICS_LIMIT=$(awk -F= '$1 == "metrics_request_limit" {print $2}' "$OUTPUTS")
          DETAILS_LIMIT=$(awk -F= '$1 == "details_request_limit" {print $2}' "$OUTPUTS")
          case "$REQUEST_MODE:$ALLOWANCE:$METRICS_LIMIT:$DETAILS_LIMIT" in
            interval_gated:0:0:0|metrics:2:2:0|metrics_and_details:14:2:12) ;;
            *)
              echo "::error::Queue budget returned malformed guard allowance outputs."
              exit 1
              ;;
          esac
          # A coalesced wake-up receives a zero allowance. Installing that
          # deny-all guard keeps every post-gate Python process fail closed.
          GUARD_FILE="$RUNNER_TEMP/queue-buildkite-request-guard-${{ github.run_id }}-${{ github.run_attempt }}.json"
          python scripts/vllm/buildkite_request_guard.py initialize \
            --file "$GUARD_FILE" \
            --attempt-id "$ATTEMPT_ID" \
            --allowance "$ALLOWANCE"
          {
            echo "BUILDKITE_REQUEST_GUARD_FILE=$GUARD_FILE"
            echo "BUILDKITE_REQUEST_GUARD_ATTEMPT_ID=$ATTEMPT_ID"
            echo "BUILDKITE_REQUEST_GUARD_ALLOWANCE=$ALLOWANCE"
          } >> "$GITHUB_ENV"
          cat "$OUTPUTS" >> "$GITHUB_OUTPUT"

      - name: Collect bounded queue snapshot
        id: collect-queue
        if: steps.queue-request-budget.outputs.request_mode != 'interval_gated'
        env:
          BUILDKITE_TOKEN: ${{ secrets.BUILDKITE_TOKEN }}
        run: |
          set -euo pipefail
          MODE="${{ steps.queue-request-budget.outputs.request_mode }}"
          DETAIL_ARG=--metrics-only
          if [ "$MODE" = "metrics_and_details" ]; then
            DETAIL_ARG=--refresh-details
          elif [ "$MODE" != "metrics" ]; then
            echo "::error::Unexpected queue request mode: $MODE"
            exit 1
          fi
          echo "Before: $(wc -l < data/vllm/ci/queue_timeseries.jsonl) lines"
          python scripts/vllm/collect_queue_snapshot.py \
            "$DETAIL_ARG" \
            --metrics-max-pages 2 \
            --details-max-pages 12
          echo "After: $(wc -l < data/vllm/ci/queue_timeseries.jsonl) lines"
          tail -1 data/vllm/ci/queue_timeseries.jsonl | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'Latest: ts={d[\"ts\"]}, queues={len(d[\"queues\"])}')"

      - name: Read exact guarded queue request total
        id: queue-request-guard-report
        if: >-
          always() &&
          steps.queue-request-budget.outcome == 'success'
        run: |
          set -euo pipefail
          python scripts/vllm/buildkite_request_guard.py report \
            --file "$BUILDKITE_REQUEST_GUARD_FILE" \
            --attempt-id "$BUILDKITE_REQUEST_GUARD_ATTEMPT_ID" \
            --allowance "$BUILDKITE_REQUEST_GUARD_ALLOWANCE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build live queue section
        if: >-
          steps.queue-request-budget.outputs.request_mode != 'interval_gated' &&
          steps.collect-queue.outcome == 'success' &&
          steps.queue-request-guard-report.outcome == 'success'
        run: python scripts/vllm/build_queue_section.py

      - name: Validate live queue evidence
        if: >-
          steps.queue-request-budget.outputs.request_mode != 'interval_gated' &&
          steps.collect-queue.outcome == 'success' &&
          steps.queue-request-guard-report.outcome == 'success'
        run: python scripts/vllm/audit_dashboard_data.py --queue-only

      - name: Publish durable live queue evidence
        if: >-
          steps.queue-request-budget.outputs.request_mode != 'interval_gated' &&
          steps.collect-queue.outcome == 'success' &&
          steps.queue-request-guard-report.outcome == 'success'
        run: |
          # Publish only queue-owned files on a dedicated single-commit branch.
          # Canonical gh-pages rebuilds can no longer overwrite or delay polls.
          LIVE_ROOT=$(mktemp -d)
          cleanup() {
            git worktree remove --force "$LIVE_ROOT" 2>/dev/null || true
            rm -rf "$LIVE_ROOT"
          }
          trap cleanup EXIT
          git worktree add --detach "$LIVE_ROOT" HEAD
          git -C "$LIVE_ROOT" switch --orphan queue-data-publish
          git -C "$LIVE_ROOT" rm -rf --ignore-unmatch .
          install -D -m 0644 data/vllm/ci/queue_timeseries.jsonl "$LIVE_ROOT/data/vllm/ci/queue_timeseries.jsonl"
          install -D -m 0644 data/vllm/ci/queue_jobs.json "$LIVE_ROOT/data/vllm/ci/queue_jobs.json"
          install -D -m 0644 data/vllm/ci/queue_history_chart.json "$LIVE_ROOT/data/vllm/ci/queue_history_chart.json"
          install -D -m 0644 data/vllm/ci/operations_v2/queue.json "$LIVE_ROOT/data/vllm/ci/operations_v2/queue.json"
          git -C "$LIVE_ROOT" config user.name "github-actions[bot]"
          git -C "$LIVE_ROOT" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$LIVE_ROOT" add \
            data/vllm/ci/queue_timeseries.jsonl \
            data/vllm/ci/queue_jobs.json \
            data/vllm/ci/queue_history_chart.json \
            data/vllm/ci/operations_v2/queue.json
          python "$GITHUB_WORKSPACE/scripts/vllm/check_git_blob_sizes.py" --root "$LIVE_ROOT"
          git -C "$LIVE_ROOT" commit -m "queue: live snapshot $(date -u +%Y-%m-%dT%H:%M)"
          git -C "$LIVE_ROOT" push --force origin HEAD:queue-data
